<!DOCTYPE html>
<html lang="en" ng-app="eduApp">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduLearn - Educational Course Portal</title>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fb;
    color: #1e293b;
}

/* Navigation */

header {
    background: #172554;
    color: white;
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    color: #60a5fa;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 16px;
}

nav a:hover {
    color: #60a5fa;
}

/* Hero Section */

.hero {
    background: linear-gradient(120deg, #172554, #2563eb);
    color: white;
    padding: 100px 10%;
    text-align: center;
}

.hero h1 {
    font-size: 45px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 18px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.btn {
    display: inline-block;
    background: #facc15;
    color: #172554;
    padding: 14px 28px;
    border: none;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

/* Sections */

.container {
    padding: 65px 8%;
}

.title {
    text-align: center;
    margin-bottom: 35px;
}

.title h2 {
    font-size: 32px;
    color: #172554;
    margin-bottom: 12px;
}

/* Course Cards */

.course-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.course-card {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.course-card:hover {
    transform: translateY(-7px);
}

.icon {
    font-size: 50px;
    margin-bottom: 18px;
}

.course-card h3 {
    margin-bottom: 15px;
    color: #172554;
}

.course-card p {
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 15px;
}

/* Registration Form */

.form-container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.form-container h2 {
    text-align: center;
    color: #2563eb;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #2563eb;
}

.gender {
    display: flex;
    gap: 25px;
    margin-top: 10px;
}

.gender label {
    font-weight: normal;
}

.gender input {
    width: auto;
}

.error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 6px;
}

.success {
    background: #dcfce7;
    color: #166534;
    padding: 18px;
    border-radius: 6px;
    margin-top: 20px;
    line-height: 1.8;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

/* Contact */

.contact-box {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 12px;
    line-height: 2.5;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

/* Footer */

footer {
    background: #172554;
    color: white;
    text-align: center;
    padding: 30px;
    line-height: 1.8;
}

/* Responsive */

@media(max-width:700px) {

    header {
        flex-direction: column;
        gap: 20px;
    }

    nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    nav a {
        margin: 0;
    }

    .hero h1 {
        font-size: 32px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        Edu<span>Learn.</span>
    </div>

    <nav>
        <a href="#!/">Home</a>
        <a href="#!/courses">Courses</a>
        <a href="#!/register">Register</a>
        <a href="#!/contact">Contact</a>
    </nav>

</header>


<!-- ANGULARJS ROUTING -->

<div ng-view></div>


<!-- FOOTER -->

<footer>

    <h2>EduLearn Educational Portal</h2>

    <p>Empowering Students Through Quality Education.</p>

    <p>© 2026 EduLearn. All Rights Reserved.</p>

</footer>


<script>

// ANGULARJS APPLICATION

var app = angular.module("eduApp", ["ngRoute"]);


// ROUTING CONFIGURATION

app.config(function($routeProvider) {

    $routeProvider

    .when("/", {

        template: `
        <section class="hero">

            <h1>Welcome to EduLearn</h1>

            <p>
                Learn New Skills. Build Your Future.
                Explore professional courses and achieve
                your career goals with EduLearn.
            </p>

            <a href="#!/courses" class="btn">
                Explore Courses
            </a>

        </section>

        <section class="container">

            <div class="title">
                <h2>Why Choose EduLearn?</h2>
                <p>Your journey towards a brighter future starts here.</p>
            </div>

            <div class="course-container">

                <div class="course-card">
                    <div class="icon">🎓</div>
                    <h3>Quality Education</h3>
                    <p>Learn from professionally designed courses.</p>
                </div>

                <div class="course-card">
                    <div class="icon">💻</div>
                    <h3>Online Learning</h3>
                    <p>Access learning resources from anywhere.</p>
                </div>

                <div class="course-card">
                    <div class="icon">🏆</div>
                    <h3>Career Growth</h3>
                    <p>Develop skills for your professional future.</p>
                </div>

            </div>

        </section>
        `

    })


    .when("/courses", {

        template: `

        <section class="container">

            <div class="title">
                <h2>Our Popular Courses</h2>
                <p>Choose your favourite course and start learning.</p>
            </div>

            <div class="course-container">

                <div class="course-card">
                    <div class="icon">💻</div>
                    <h3>Web Development</h3>
                    <p>Learn HTML, CSS, JavaScript and create websites.</p>
                    <h3>₹4,999</h3>
                    <a href="#!/register" class="btn">Enroll Now</a>
                </div>

                <div class="course-card">
                    <div class="icon">🐍</div>
                    <h3>Python Programming</h3>
                    <p>Learn Python programming from basic to advanced.</p>
                    <h3>₹3,999</h3>
                    <a href="#!/register" class="btn">Enroll Now</a>
                </div>

                <div class="course-card">
                    <div class="icon">📊</div>
                    <h3>Data Science</h3>
                    <p>Explore data analysis and machine learning.</p>
                    <h3>₹5,999</h3>
                    <a href="#!/register" class="btn">Enroll Now</a>
                </div>

                <div class="course-card">
                    <div class="icon">🤖</div>
                    <h3>Artificial Intelligence</h3>
                    <p>Understand AI concepts and intelligent systems.</p>
                    <h3>₹5,499</h3>
                    <a href="#!/register" class="btn">Enroll Now</a>
                </div>

            </div>

        </section>

        `

    })


    .when("/register", {

        template: `

        <section class="container">

            <div class="form-container">

                <h2>Student Registration Form</h2>

                <form name="registrationForm"
                      ng-submit="register()"
                      novalidate>

                    <!-- NAME -->

                    <div class="form-group">

                        <label>Name *</label>

                        <input type="text"
                               name="name"
                               ng-model="student.name"
                               ng-pattern="/^[A-Za-z ]+$/"
                               required
                               placeholder="Enter your name">

                        <p class="error"
                           ng-show="registrationForm.name.$touched &&
                           registrationForm.name.$error.required">
                            Name is required.
                        </p>

                        <p class="error"
                           ng-show="registrationForm.name.$error.pattern">
                            Name should not contain numbers.
                        </p>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label>Password *</label>

                        <input type="password"
                               name="password"
                               ng-model="student.password"
                               ng-pattern="/^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}$/"
                               required
                               placeholder="Enter password">

                        <p class="error"
                           ng-show="registrationForm.password.$touched &&
                           registrationForm.password.$invalid">
                            Password must contain at least 8 characters,
                            one uppercase, one lowercase and one number.
                        </p>

                    </div>


                    <!-- AGE -->

                    <div class="form-group">

                        <label>Age *</label>

                        <input type="number"
                               name="age"
                               ng-model="student.age"
                               min="18"
                               max="30"
                               required
                               placeholder="Enter your age">

                        <p class="error"
                           ng-show="registrationForm.age.$touched &&
                           registrationForm.age.$invalid">
                            Age must be between 18 and 30.
                        </p>

                    </div>


                    <!-- MOBILE -->

                    <div class="form-group">

                        <label>Mobile Number *</label>

                        <input type="text"
                               name="mobile"
                               ng-model="student.mobile"
                               ng-pattern="/^[0-9]{10}$/"
                               required
                               placeholder="Enter 10 digit mobile number">

                        <p class="error"
                           ng-show="registrationForm.mobile.$touched &&
                           registrationForm.mobile.$invalid">
                            Enter a valid 10 digit mobile number.
                        </p>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label>Email *</label>

                        <input type="email"
                               name="email"
                               ng-model="student.email"
                               required
                               placeholder="Enter your email">

                        <p class="error"
                           ng-show="registrationForm.email.$touched &&
                           registrationForm.email.$invalid">
                            Enter a valid email address.
                        </p>

                    </div>


                    <!-- GENDER -->

                    <div class="form-group">

                        <label>Gender *</label>

                        <div class="gender">

                            <label>
                                <input type="radio"
                                       name="gender"
                                       ng-model="student.gender"
                                       value="Male"
                                       required>
                                Male
                            </label>

                            <label>
                                <input type="radio"
                                       name="gender"
                                       ng-model="student.gender"
                                       value="Female"
                                       required>
                                Female
                            </label>

                        </div>

                        <p class="error"
                           ng-show="registrationForm.gender.$touched &&
                           registrationForm.gender.$error.required">
                            Please select your gender.
                        </p>

                    </div>


                    <!-- STATE -->

                    <div class="form-group">

                        <label>State *</label>

                        <select name="state"
                                ng-model="student.state"
                                required>

                            <option value="">Select State</option>
                            <option>Tamil Nadu</option>
                            <option>Kerala</option>
                            <option>Karnataka</option>
                            <option>Andhra Pradesh</option>
                            <option>Telangana</option>
                            <option>Maharashtra</option>

                        </select>

                        <p class="error"
                           ng-show="registrationForm.state.$touched &&
                           registrationForm.state.$invalid">
                            Please select your state.
                        </p>

                    </div>


                    <!-- SUBMIT BUTTON -->

                    <button type="submit"
                            class="submit-btn"
                            ng-disabled="registrationForm.$invalid">

                        Submit Registration

                    </button>

                </form>


                <!-- SUCCESS MESSAGE -->

                <div class="success" ng-if="submitted">

                    <h3>Registration Successful!</h3>

                    <p>Welcome to EduLearn, {{student.name}}!</p>

                    <p>Your registration has been completed successfully.</p>

                </div>

            </div>

        </section>

        `,

        controller: function($scope) {

            $scope.student = {};

            $scope.submitted = false;

            $scope.register = function() {

                $scope.submitted = true;

            };

        }

    })


    .when("/contact", {

        template: `

        <section class="container">

            <div class="title">
                <h2>Contact Us</h2>
                <p>We are happy to help you.</p>
            </div>

            <div class="contact-box">

                <h2>EduLearn Educational Portal</h2>

                <p>📍 Coimbatore, Tamil Nadu, India</p>

                <p>📧 support@edulearn.com</p>

                <p>📞 +91 9876543210</p>

                <p>
                    Our mission is to provide quality education
                    and help students develop their skills.
                </p>

                <a href="#!/" class="btn">Back to Home</a>

            </div>

        </section>

        `

    })


    .otherwise({

        redirectTo: "/"

    });

});

</script>

</body>
</html>
